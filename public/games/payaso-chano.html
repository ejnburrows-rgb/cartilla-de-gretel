<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Payaso Chano - La Cartilla de Gretel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #e4f1ef; /* Fallback */
    background-image: url('../cartilla/art/optimized/games/payaso-bg.jpg');
    background-size: cover;
    background-position: center;
    color: #333;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
    touch-action: none; /* Prevent scroll on drag */
  }
  .header {
    text-align: center; padding: 10px; background: rgba(255,255,255,0.7);
    font-size: 24px; font-weight: bold; color: #167a72;
    border-bottom: 2px solid #167a72;
  }
  .main-area {
    display: flex; flex: 1; flex-direction: row; align-items: stretch;
    padding: 10px; gap: 10px;
  }
  .left-panel {
    flex: 0 0 250px; display: flex; flex-direction: column;
    background: url('../cartilla/art/optimized/games/instructions-bg.png') no-repeat center;
    background-size: 100% 100%;
    padding: 30px 20px;
  }
  .instructions {
    margin-bottom: auto;
  }
  .instructions h2 { margin-top: 0; font-size: 20px; color: #2e7d43; text-align: center; }
  .instructions ol { padding-left: 20px; margin-bottom: 0; font-size: 16px; }
  .instructions li { margin-bottom: 8px; }

  .chano-container {
    text-align: center; margin-top: 20px;
  }
  .chano-img {
    width: 100%; max-width: 200px; height: auto;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }

  .right-panel {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: url('../cartilla/art/optimized/games/chalkboard-bg.png') no-repeat center;
    background-size: 100% 100%;
    padding: 40px; position: relative;
  }
  .word-target {
    font-size: 48px; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px #000;
    margin-bottom: 20px; letter-spacing: 4px; text-transform: uppercase;
  }
  .slots {
    display: flex; gap: 15px; margin-bottom: 40px; min-height: 80px;
  }
  .slot {
    width: 80px; height: 80px; border: 3px dashed rgba(255,255,255,0.5); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: rgba(255,255,255,0.5); font-weight: bold;
    background: rgba(0,0,0,0.2); transition: all 0.2s;
  }
  .slot.filled { border-style: solid; border-color: #fff; background: none; }
  .slot.target { border-color: #ffeb3b; background: rgba(255,235,59,0.2); }

  .pool {
    display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
  }

  .ball-btn {
    width: 80px; height: 80px; padding: 0; border: none; background: none;
    cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .ball-img { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
  .syllable { position: relative; z-index: 2; font-size: 28px; font-weight: bold; color: #333; pointer-events: none; }

  .controls {
    margin-top: auto; display: flex; gap: 10px; width: 100%; justify-content: center;
    padding-top: 20px;
  }
  .btn {
    padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;
    border: 2px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.95); }
  .btn-check { background: #4caf50; color: white; }
  .btn-reset { background: #f44336; color: white; }

  #ghost { display: none; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }

  #status { position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 20px; background: rgba(0,0,0,0.7); color: white;
    font-weight: bold; font-size: 18px; text-align: center; opacity: 0; transition: opacity 0.3s;
    z-index: 100; pointer-events: none; }
  #status.show { opacity: 1; }
  #status.correct { background: rgba(76, 175, 80, 0.9); }
  #status.incorrect { background: rgba(244, 67, 54, 0.9); }

  /* Animations */
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  @keyframes wobble { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .bounce { animation: bounce 0.5s ease-in-out; }
  .wobble { animation: wobble 0.5s ease-in-out; }

  /* Responsive Adjustments */
  @media (max-aspect-ratio: 1/1) { /* Portrait */
    .main-area { flex-direction: column; }
    .left-panel { flex: none; flex-direction: row; align-items: center; padding: 15px; height: 180px; }
    .instructions { flex: 1; font-size: 14px; }
    .instructions h2 { font-size: 16px; margin-bottom: 5px;}
    .instructions ol { padding-left: 15px; }
    .instructions li { margin-bottom: 4px; }
    .chano-container { margin-top: 0; flex: 0 0 100px; }
    .right-panel { padding: 20px; }
    .word-target { font-size: 36px; margin-bottom: 10px; }
    .slot, .ball-btn { width: 60px; height: 60px; font-size: 18px; }
    .syllable { font-size: 22px; }
    .controls { padding-top: 10px; }
    .btn { padding: 8px 16px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="header" id="counter">El Payaso Chano - Palabra 1</div>

<div class="main-area">
  <div class="left-panel">
    <div class="instructions">
      <h2>Instrucciones</h2>
      <ol>
        <li>Mira la palabra en la pizarra.</li>
        <li>Busca las sílabas correctas abajo.</li>
        <li>Arrastra las pelotas a las casillas.</li>
        <li>Toca "Comprobar" para revisar.</li>
      </ol>
    </div>
    <div class="chano-container" id="scene">
      <img src="../cartilla/art/optimized/games/chano-large.png" alt="Payaso Chano" class="chano-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'300\'><rect width=\'200\' height=\'300\' fill=\'%23ddd\'/><text x=\'100\' y=\'150\' text-anchor=\'middle\' fill=\'%23666\'>Payaso Chano</text></svg>'">
    </div>
  </div>

  <div class="right-panel" id="board">
    <div id="status"></div>
    <div class="word-target" id="word">MIMA</div>
    <div class="slots" id="slots"></div>
    <div class="pool" id="pool"></div>
    <div class="controls">
      <button class="btn btn-reset" id="reset">Borrar todo</button>
      <button class="btn btn-check" id="check">Comprobar</button>
    </div>
  </div>
</div>

<div id="ghost"></div>

<script>
(function(){
const rounds = [{word:"mima", syllables:["mi","ma"]}]; // Simplified for now, just to show mechanics
// Requirement: exactly four ball syllables ma mi mu me
const fixedPool = ["ma", "mi", "mu", "me"];
const imageURL = '../cartilla/art/optimized/games/ball.png'; // Placeholder if missing
const fallbackImg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23fff" stroke="%23333" stroke-width="2"/><circle cx="50" cy="50" r="35" fill="none" stroke="%23ccc" stroke-width="1"/></svg>';

let round = 0, slots = [], completed = new Set(), lastDrop = -1, drag = null, suppressClick = false;
const $ = x => document.getElementById(x);
const poolEl = $('pool'), slotEl = $('slots'), statusEl = $('status'), board = $('board');
let statusTimer = null;

function say(message, cls='') {
  statusEl.textContent = message;
  statusEl.className = 'show ' + cls;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => statusEl.className = '', 2000);
}

function createBall(sy, used=false) {
  const el = document.createElement('button');
  el.type = 'button'; el.className = 'ball-btn'; el.dataset.sy = sy;
  el.setAttribute('aria-label', 'Sílaba ' + sy);
  el.innerHTML = `<img src="${imageURL}" alt="" class="ball-img" onerror="this.src='${fallbackImg}'"><span class="syllable">${sy}</span>`;
  if (!used) {
    el.addEventListener('pointerdown', down);
    el.addEventListener('click', ev => {
      if (suppressClick) { suppressClick = false; return; }
      if (ev.detail !== 0) placeFirst(sy);
    });
  }
  return el;
}

function render() {
  const w = rounds[round];
  $('word').textContent = w.word.toUpperCase();
  $('counter').textContent = `El Payaso Chano - Palabra ${round + 1}`;

  slotEl.replaceChildren();
  w.syllables.forEach((sy, i) => {
    const el = document.createElement('div');
    el.className = 'slot' + (slots[i] ? ' filled' : '') + (lastDrop === i ? ' bounce' : '');
    el.dataset.slot = i;
    if (slots[i]) {
      const b = createBall(slots[i], true);
      b.addEventListener('click', () => {
        slots[i] = null; lastDrop = -1;
        render();
      });
      el.appendChild(b);
    } else {
      el.textContent = i + 1;
    }
    slotEl.append(el);
  });

  poolEl.replaceChildren(...fixedPool.map(sy => createBall(sy)));
}

function targetIndex() { return slots.findIndex(s => !s); }
function place(sy, i) {
  if (i < 0 || i >= slots.length || slots[i]) return false;
  slots[i] = sy; lastDrop = i;
  render(); return true;
}
function placeFirst(sy) {
  const i = targetIndex();
  if (i >= 0) place(sy, i); else say('Casillas llenas. Borra una primero.');
}

function down(ev) {
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  const el = ev.currentTarget;
  drag = { id: ev.pointerId, sy: el.dataset.sy, x: ev.clientX, y: ev.clientY, moved: false, element: el };
  el.setPointerCapture(ev.pointerId);
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', cancel);
}

function move(ev) {
  if (!drag || drag.id !== ev.pointerId) return;
  const d = drag;
  d.moved ||= Math.hypot(ev.clientX - d.x, ev.clientY - d.y) > 5;
  if (d.moved) {
    const ghost = $('ghost');
    if (ghost.style.display !== 'block') {
      ghost.style.display = 'block';
      ghost.innerHTML = d.element.innerHTML;
      ghost.style.position = 'fixed';
      ghost.style.width = d.element.offsetWidth + 'px';
      ghost.style.height = d.element.offsetHeight + 'px';
    }
    ghost.style.left = ev.clientX + 'px';
    ghost.style.top = ev.clientY + 'px';
    highlight(ev.clientX, ev.clientY);
  }
}

function slotAt(x, y) {
  const e = document.elementFromPoint(x, y)?.closest('.slot');
  return e ? Number(e.dataset.slot) : -1;
}

function highlight(x, y) {
  const idx = slotAt(x, y);
  slotEl.querySelectorAll('.slot').forEach((e, i) => e.classList.toggle('target', idx === i && !slots[i]));
}

function cleanup() {
  if (!drag) return;
  const el = drag.element;
  el.removeEventListener('pointermove', move);
  el.removeEventListener('pointerup', up);
  el.removeEventListener('pointercancel', cancel);
  $('ghost').style.display = 'none';
  slotEl.querySelectorAll('.slot').forEach(e => e.classList.remove('target'));
  drag = null;
}

function up(ev) {
  if (!drag || ev.pointerId !== drag.id) return;
  const d = drag;
  const idx = slotAt(ev.clientX, ev.clientY);
  cleanup();
  if (d.moved) {
    suppressClick = true; setTimeout(() => suppressClick = false, 50);
    if (idx >= 0 && !slots[idx]) place(d.sy, idx);
  } else {
    placeFirst(d.sy);
    suppressClick = true; setTimeout(() => suppressClick = false, 50);
  }
}
function cancel() { cleanup(); }

function check() {
  if (slots.some(x => !x)) { say('Llena todas las casillas.'); return; }
  const w = rounds[round];
  if (slots.every((s, i) => s === w.syllables[i])) {
    say('¡Correcto!', 'correct');
    slotEl.querySelectorAll('.slot').forEach(x => x.classList.add('bounce'));
    // Proceed to next round if we had more
  } else {
    say('Incorrecto. Intenta de nuevo.', 'incorrect');
    slotEl.querySelectorAll('.slot').forEach(x => x.classList.add('wobble'));
  }
}

function reset() {
  slots = Array(rounds[round].syllables.length).fill(null);
  lastDrop = -1; render();
}

$('check').addEventListener('click', check);
$('reset').addEventListener('click', reset);

slots = Array(rounds[0].syllables.length).fill(null);
render();

})();
</script>
</body>
</html>
