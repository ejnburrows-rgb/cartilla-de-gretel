<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07549a"><title>Juego Payaso Chano — Cartilla</title>
<style>
:root{font-family:Trebuchet MS,Verdana,system-ui,sans-serif;color:#fff9e9;--gold:#f9cf4a;--green:#0d713c;--blue:#07549a;--wood:#ba6829;}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#093b7b}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #fff25c;outline-offset:3px}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 18% 30%,#248dcc,#0a5aab 45%,#083d7e 85%,#062957);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.mast{flex:none;min-height:45px;padding:5px clamp(9px,2vw,24px);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#072c60e8;border-bottom:2px solid #f4ba43;z-index:2}
.brand{font-family:Georgia,serif;font-weight:900;font-size:clamp(17px,2.2vw,28px);line-height:1.02;color:#fff2bc;white-space:nowrap;text-shadow:1px 2px 0 #9f4726;}
.counter{flex:none;background:#ffffff1c;padding:7px 12px;border:1px solid #ffffff66;border-radius:22px;font-size:clamp(11px,1.3vw,14px);font-weight:800}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:minmax(145px,25%) minmax(0,1fr) minmax(145px,23%);gap:clamp(7px,1.2vw,16px);padding:clamp(7px,1vw,14px);overflow:hidden}
.scene{grid-column:1;grid-row:1;position:relative;min-height:0;overflow:hidden;border:3px solid #f5bc48;border-radius:26px;background:radial-gradient(circle at 50% 47%,#ffe475 0%,#9be1bc 36%,#2489b6 80%,#07569e);box-shadow:inset 0 0 35px #063f7188,0 9px 18px #001e4066}
.scene:before{content:"";position:absolute;inset:4%;border-radius:20px;border:3px dotted #fff6b9a8;pointer-events:none}
.scene .clown{position:absolute;left:7%;width:86%;height:84%;top:12%;object-fit:contain;filter:drop-shadow(0 6px 8px #06376c66);transform-origin:center 80%;animation:chanoBob 3.2s ease-in-out infinite;pointer-events:none}
.scene.laugh .clown{animation:chanoLaugh .55s ease-in-out 3}
@keyframes chanoBob{50%{transform:translateY(-2.5%) rotate(1.2deg)}}
@keyframes chanoLaugh{25%{transform:translateY(-7%) scale(1.035) rotate(-2deg)}65%{transform:translateY(1%) rotate(2deg)}}
.orbit{position:absolute;inset:0;pointer-events:none}
.orb{position:absolute;width:clamp(38px,21%,80px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 4px 4px #08457666);animation-timing-function:cubic-bezier(.45,.02,.55,.98);animation-iteration-count:infinite}
.orb.o1{left:8%;top:12%;animation-name:juggleOne;animation-duration:3.1s}
.orb.o2{right:11%;top:12%;animation-name:juggleTwo;animation-duration:3.1s;animation-delay:-1.03s}
.orb.o3{left:40%;top:2%;animation-name:juggleThree;animation-duration:3.1s;animation-delay:-2.06s}
@keyframes juggleOne{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(95%,-18%) rotate(100deg)}}
@keyframes juggleTwo{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-95%,-17%) rotate(-100deg)}}
@keyframes juggleThree{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-20%,36%) rotate(75deg)}}
.laugh-text{position:absolute;z-index:2;top:10%;right:6%;border-radius:30px;background:#fff3b9;color:#984018;padding:7px 11px;font-weight:900;font-size:clamp(14px,1.5vw,22px);box-shadow:0 5px 12px #063b6d80;animation:pop .75s both}
@keyframes pop{from{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}to{transform:scale(1);opacity:1}}
.instructions{grid-column:3;grid-row:1;min-height:0;overflow:hidden;border:4px solid #f5c548;border-radius:22px;background:linear-gradient(155deg,#fff9e7,#e5f9e6);color:#204a2e;display:flex;flex-direction:column;padding:clamp(10px,1.3vw,20px);box-shadow:0 9px 19px #001d3960}
.instructions h2{font:900 clamp(17px,2.1vw,30px)/1.1 Georgia,serif;color:#06562f;margin:0 0 clamp(6px,2vh,20px);padding-bottom:8px;border-bottom:2px dotted #97bd8a}
.instructions ol{display:flex;flex-direction:column;justify-content:space-evenly;gap:8px;margin:0;padding:0;list-style:none;flex:1;min-height:0}
.instructions li{display:flex;align-items:center;gap:7px;font-size:clamp(12px,1.4vw,17px);line-height:1.25;font-weight:700}
.instructions li b{flex:none;display:grid;place-items:center;background:#e26d23;color:white;border-radius:50%;height:26px;width:26px}
.main-game{grid-column:2;grid-row:1;display:flex;flex-direction:column;gap:clamp(5px,1.2vh,13px);min-width:0;min-height:0;overflow:hidden}
.chalk{flex:1;min-height:0;border-radius:23px;border:10px ridge #c78233;background:radial-gradient(ellipse at 45% 17%,#0b8742,#096736 68%,#064e28);box-shadow:inset 0 0 28px #003016,0 7px 14px #001d427d;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:clamp(8px,1.5vw,25px);gap:4px;position:relative}
.chalk:before{content:"";inset:3px;position:absolute;pointer-events:none;border-radius:10px;border:1px solid #ffffff33}
.word-title{font:900 clamp(21px,2.5vw,38px)/1.05 Georgia,serif;color:#fff1ab;text-align:center;text-shadow:1px 2px 1px #014521}
#word{display:inline-block;color:#fff;text-transform:uppercase;letter-spacing:1px}
#slots{display:flex;justify-content:center;align-items:center;gap:clamp(4px,.9vw,13px);width:100%;min-height:0}
.slot{width:clamp(52px,10.5vw,145px);height:clamp(54px,10.5vw,145px);max-height:min(21vh,145px);border:3px dashed #f0dea4;border-radius:18px;background:#ffffff18;display:grid;place-items:center;flex:none;overflow:visible;color:#b8f0b0;font-size:clamp(21px,3vw,46px);font-weight:bold;outline-offset:2px}
.slot.filled{border:2px solid #fff7b0;background:#ffffff12;cursor:pointer}
.slot.target{border-color:#ffe542;background:#fff3ab2e}
.slot.bounce{animation:bounce .42s}
@keyframes bounce{0%{transform:translateY(-25%)}55%{transform:translateY(10%)}100%{transform:translateY(0)}}
.slot.wobble{animation:wobble .5s ease-in-out}
@keyframes wobble{25%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
.chalk.success{box-shadow:inset 0 0 30px #b5ff6090,0 8px 20px #001d42;animation:boardCheer .55s}
@keyframes boardCheer{0%,100%{transform:translateY(0)}35%{transform:translateY(-5px)}70%{transform:translateY(2px)}}
.chalk.error{animation:wobble .6s}
.ball-img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
#status{min-height:20px;text-align:center;font-size:clamp(12px,1.6vw,19px);line-height:1.14;font-weight:800;color:#fffada}
#status.correct{color:#e3ff8c}#status.incorrect{color:#ffd0b8}
.tray{flex:none;min-height:0;display:flex;justify-content:space-around;align-items:center;gap:clamp(2px,1vw,12px);padding:5px 5px;border-radius:18px;background:#e5a549a6;border:3px solid #ffd47a;box-shadow:inset 0 -6px #ad61155a}
.ball-btn{position:relative;width:min(15%,110px);aspect-ratio:1;max-height:clamp(55px,16vh,118px);min-width:45px;min-height:45px;flex:1 1 0;border:0;background:transparent;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:filter .15s}
.ball-btn:hover{filter:brightness(1.08)}.ball-btn:active{cursor:grabbing}
.ball-btn img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.syllable{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-shadow:2px 3px 1px #b8381c,-2px -1px 1px #ae3419;-webkit-text-stroke:.6px #b93a1f;font-weight:1000;font-size:clamp(17px,2.8vw,33px);pointer-events:none}
.slot .ball-btn{width:85%;height:85%;max-height:none;min-width:0;min-height:0;flex:none;cursor:pointer}
.slot .ball-btn .syllable{font-size:clamp(20px,3vw,35px)}
.actions{flex:none;display:flex;align-items:stretch;justify-content:space-between;gap:clamp(4px,.7vw,9px);min-height:48px}
.act{border:2px solid #fff1b4;border-radius:14px;box-shadow:0 4px 0 #99511f,inset 0 2px #ffffff8d;background:linear-gradient(#ffe47c,#ec9c36);color:#563111;font-weight:900;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px clamp(5px,.6vw,10px);flex:1 1 0;min-width:44px;min-height:44px;font-size:clamp(10px,1.05vw,15px);}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 #99511f}.act img{width:clamp(25px,3vw,43px);height:clamp(25px,3vw,43px);object-fit:contain;pointer-events:none}
.act:disabled{opacity:.68;cursor:not-allowed}.act.umbrella{background:linear-gradient(#d8ff79,#4fc555)}.act.mini{background:linear-gradient(#e1f9ff,#8dd5ee)}.act.audio{background:linear-gradient(#fff8c3,#eacc74)}
.ico{font-size:clamp(19px,2.2vw,28px);font-weight:900;line-height:1}.spr-svg{width:38px;height:38px;flex:none}
#ghost{position:fixed;width:78px;height:78px;display:none;pointer-events:none;z-index:100;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 7px #0008)}
.offline-note{position:absolute;left:-9999px}.notice{color:#ffe7a8;font-weight:800;font-size:clamp(11px,1.2vw,15px);line-height:1.2;text-align:center}
@media (max-width:690px) and (orientation:portrait){
 .mast{min-height:43px}.shell{display:flex;flex-direction:column;gap:5px;padding:5px}
 .scene{flex:1.15 1 25%;min-height:90px;max-height:27%;width:100%}.scene .clown{width:46%;height:116%;left:27%;top:-4%}
 .orb{width:12%;max-width:60px}.orb.o1{top:30%;left:17%}.orb.o2{top:30%;right:18%}.orb.o3{top:3%;left:43%}
 .instructions{flex:none;min-height:43px;max-height:76px;padding:5px 9px;border-width:2px;border-radius:12px}
 .instructions h2{font:900 13px Georgia,serif;margin:0;padding:0;border:0;text-align:center}
 .instructions ol{flex-direction:row;gap:4px;justify-content:space-between}
 .instructions li{font-size:10px;line-height:1.06;gap:3px;flex:1 1 0}
 .instructions li b{width:17px;height:17px;font-size:10px}
 .main-game{flex:2.5 1 60%;min-height:0;gap:5px}
 .chalk{border-width:7px;border-radius:14px;padding:4px;gap:3px}
 .word-title{font-size:clamp(18px,6vw,29px)}
 .slot{width:clamp(56px,22vw,92px);height:clamp(55px,19vw,85px);max-height:none;border-radius:12px}
 .tray{padding:3px;gap:1px;border-width:2px;border-radius:11px}
 .ball-btn{min-width:46px;max-width:72px;min-height:46px;max-height:72px}
 .syllable{font-size:clamp(17px,5.5vw,23px)}
 .slot .ball-btn .syllable{font-size:23px}
 .actions{gap:3px;min-height:61px}
 .act{padding:2px 2px;font-size:clamp(8px,2.5vw,10px);border-radius:10px;min-height:56px;gap:1px;flex-direction:column;line-height:1.1}
 .act img{width:29px;height:29px}.spr-svg{width:29px;height:29px}
 #status{font-size:clamp(11px,3vw,14px)}
}
@media (orientation:landscape) and (max-height:520px){
 .mast{min-height:34px;padding-block:2px}.brand{font-size:17px}.counter{padding:3px 8px}
 .shell{gap:5px;padding:4px;grid-template-columns:minmax(105px,24%) minmax(0,1fr) minmax(120px,21%)}
 .scene{border-radius:15px;border-width:2px}.scene .clown{top:4%;height:91%}
 .instructions{padding:7px;border-width:2px;border-radius:12px}.instructions h2{font-size:15px;padding-bottom:3px;margin-bottom:3px}.instructions ol{gap:2px}.instructions li{font-size:10px;gap:3px}.instructions li b{width:18px;height:18px;font-size:11px}
 .main-game{gap:4px}.chalk{border-width:6px;border-radius:12px;padding:3px;gap:2px}
 .word-title{font-size:clamp(16px,2.6vw,22px)}
 #status{font-size:11px;min-height:14px}
 .slot{width:clamp(51px,7.8vw,79px);height:clamp(51px,7.8vw,79px);max-height:82px;border-radius:12px}
 .slot .ball-btn .syllable{font-size:19px}
 .tray{padding:0;min-height:55px;border-width:2px;border-radius:10px}
 .ball-btn{min-height:44px;min-width:44px;max-height:53px;max-width:65px}
 .syllable{font-size:17px}
 .actions{min-height:45px}.act{font-size:10px;padding:2px 4px;min-height:44px;border-radius:9px}.act img{width:25px;height:25px}.spr-svg{width:25px;height:25px}
}
@media(prefers-reduced-motion:reduce){.clown,.orb{animation:none!important}.laugh-text{animation:none!important}.slot.bounce,.slot.wobble,.chalk.success,.chalk.error{animation:none!important}}
</style></head>

function createBall(sy,used=false){const el=document.createElement('button');el.type='button';el.className='ball-btn';el.dataset.sy=sy;el.setAttribute('aria-label','Sílaba '+sy);el.innerHTML='<img src="'+imageURL+'" alt=""><span class="syllable"></span>';el.querySelector('.syllable').textContent=sy;if(!used){el.addEventListener('pointerdown',down);el.addEventListener('click',ev=>{if(suppressClick){suppressClick=false;return;}if(ev.detail!==0)placeFirst(sy);});el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();placeFirst(sy)}});}return el}
function trayWords(){const w=rounds[round];const poolArray=[...new Set([...w.syllables, ...['ma','me','mi','mo','mu','pa','so','sa','pu','su','po','a']])];return poolArray.slice(0,Math.max(5,w.syllables.length+2))}
function render(){const w=rounds[round];$('word').textContent=w.word.toUpperCase();$('counter').textContent='Palabra '+(round+1)+' / '+rounds.length+' · '+completed.size+' ✓';slotEl.replaceChildren();w.syllables.forEach((sy,i)=>{const el=document.createElement('button');el.type='button';el.className='slot'+(slots[i]?' filled':'')+(lastDrop===i?' bounce':'');el.dataset.slot=i;el.setAttribute('aria-label',slots[i]?'Casilla '+(i+1)+': '+slots[i]+'; quitar':'Casilla '+(i+1)+' vacía');if(slots[i]){el.appendChild(createBall(slots[i],true));el.addEventListener('click',()=>{slots[i]=null;lastDrop=-1;board.classList.remove('success','error');say('Sílaba retirada.');render()})}else el.textContent=i+1;slotEl.append(el)});pool.replaceChildren(...trayWords().map(sy=>createBall(sy)));$('listen').disabled=!recordedWords[w.word];$('listen').title=$('listen').disabled?'Grabación humana pendiente':'Escuchar '+w.word;$('listen').setAttribute('aria-label',$('listen').disabled?'Voz humana pendiente':'Escuchar '+w.word);$('mute').disabled=!recordedMusic;$('mute').title=$('mute').disabled?'Grabación musical humana pendiente':'Música de fondo';$('mute').setAttribute('aria-label',$('mute').disabled?'Música humana pendiente':'Activar o silenciar música');}
function targetIndex(){return slots.findIndex(s=>!s)}
function place(sy,i){if(i<0||i>=slots.length||slots[i])return false;slots[i]=sy;lastDrop=i;board.classList.remove('success','error');say('Colocaste «'+sy+'».');snap();render();return true}
function placeFirst(sy){const i=targetIndex();if(i>=0)place(sy,i);else say('Retira una pelota de la pizarra para cambiarla.');}
function snap(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=snap.ctx||(snap.ctx=new C());if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.setValueAtTime(680,t);o.frequency.exponentialRampToValueAtTime(420,t+.07);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.085);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.1)}catch(e){}}
function down(ev){if(ev.pointerType==='mouse'&&ev.button!==0)return;const el=ev.currentTarget;drag={id:ev.pointerId,sy:el.dataset.sy,x:ev.clientX,y:ev.clientY,moved:false,element:el};el.setPointerCapture(ev.pointerId);el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',cancel);}
function move(ev){if(!drag||drag.id!==ev.pointerId)return;const d=drag;d.moved ||=Math.hypot(ev.clientX-d.x,ev.clientY-d.y)>7;if(d.moved){const ghost=$('ghost');if(ghost.style.display!=='block'){ghost.style.display='block';ghost.innerHTML='<img class="ball-img" src="'+imageURL+'"><span class="syllable">'+d.sy+'</span>';ghost.style.position='fixed';ghost.style.width= Math.max(48,Math.min(80,d.element.getBoundingClientRect().width))+'px';ghost.style.height=ghost.style.width;}ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';highlight(ev.clientX,ev.clientY)}}
function slotAt(x,y){const e=document.elementFromPoint(x,y)?.closest('.slot');return e?Number(e.dataset.slot):-1}
function highlight(x,y){const idx=slotAt(x,y);slotEl.querySelectorAll('.slot').forEach((e,i)=>e.classList.toggle('target',idx===i&&!slots[i]))}
function cleanup(){if(!drag)return;const el=drag.element;el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',cancel);$('ghost').style.display='none';slotEl.querySelectorAll('.slot').forEach(e=>e.classList.remove('target'));drag=null}
function up(ev){if(!drag||ev.pointerId!==drag.id)return;const d=drag;const idx=slotAt(ev.clientX,ev.clientY);cleanup();if(d.moved){suppressClick=true;setTimeout(()=>suppressClick=false,100);if(idx>=0&&!slots[idx])place(d.sy,idx);else say('Suelta la pelota en una casilla vacía.')}else{placeFirst(d.sy);suppressClick=true;setTimeout(()=>suppressClick=false,100)}}
function cancel(){cleanup()}
function check(){if(slots.some(x=>!x)){say('Completa todas las casillas.');return}const w=rounds[round];if(slots.every((s,i)=>s===w.syllables[i])){completed.add(round);$('counter').textContent='Palabra '+(round+1)+' / '+rounds.length+' · '+completed.size+' ✓';board.classList.remove('error');board.classList.add('success');say('¡Muy bien! Formaste '+w.word.toUpperCase()+'.','correct');$('scene').classList.add('laugh');if(!document.querySelector('.laugh-text')){const sp=document.createElement('span');sp.className='laugh-text';sp.textContent='¡Ja, ja!';$('scene').append(sp);setTimeout(()=>sp.remove(),900)}setTimeout(()=>$('scene').classList.remove('laugh'),1600);slotEl.querySelectorAll('.slot').forEach(x=>x.classList.add('bounce'));snap()}else{board.classList.remove('success');board.classList.add('error');say('Prueba otra vez: mueve o borra una sílaba.','incorrect');slotEl.querySelectorAll('.slot').forEach(x=>x.classList.add('wobble'))}}
function reset(){slots=Array(rounds[round].syllables.length).fill(null);lastDrop=-1;board.classList.remove('success','error');say('Pizarra limpia. ¡Vuelve a intentarlo!');render()}
function next(){round=(round+1)%rounds.length;slots=Array(rounds[round].syllables.length).fill(null);lastDrop=-1;board.classList.remove('success','error');say('Forma la palabra «'+rounds[round].word+'».');render()}
function playRecording(word){if(!recordedWords[word]){say('Falta la grabación humana de «'+word+'».');return}try{if(audio.word){audio.word.pause();audio.word=null}const clip=new Audio(recordedWords[word]);audio.word=clip;if(audio.music&&!audio.music.paused)audio.music.volume=.05;clip.addEventListener('ended',()=>{if(audio.music)audio.music.volume=.15},{once:true});clip.addEventListener('error',()=>say('Error al reproducir «'+word+'».'));clip.play().catch(()=>say('Toca Escuchar de nuevo para iniciar el sonido.'))}catch(e){say('No se puede reproducir audio.') }}
function muteMusic(){if(!recordedMusic)return;try{if(!audio.music){audio.music=new Audio(recordedMusic);audio.music.loop=true;audio.music.volume=.15}musicEnabled=!musicEnabled;$('mute').setAttribute('aria-pressed',String(musicEnabled));$('music-label').textContent=musicEnabled?'Silenciar':'Música';if(musicEnabled)audio.music.play().catch(()=>{musicEnabled=false;$('mute').setAttribute('aria-pressed','false');say('No se pudo reproducir la música.')});else audio.music.pause()}catch(e){say('Error de música.')}}
$('check').addEventListener('click',check);$('reset').addEventListener('click',reset);$('next').addEventListener('click',next);$('listen').addEventListener('click',()=>playRecording(rounds[round].word));$('mute').addEventListener('click',muteMusic);
slots=Array(rounds[0].syllables.length).fill(null);render();
window.__chanoTest={rounds,getState:()=>({round,word:rounds[round].word,slots:[...slots],completed:[...completed]}),place,check,reset,next,muteMusic};
})();</script></body></html>
