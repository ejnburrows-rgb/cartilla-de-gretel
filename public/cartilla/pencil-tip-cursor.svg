<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
<defs>
  <linearGradient id="graphite" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#171715"/><stop offset=".38" stop-color="#3a3a38"/><stop offset=".72" stop-color="#686862"/><stop offset="1" stop-color="#262624"/></linearGradient>
  <linearGradient id="cedar" x1=".1" y1=".2" x2=".9" y2=".8"><stop stop-color="#fff0cc"/><stop offset=".34" stop-color="#d7a369"/><stop offset=".67" stop-color="#f1d19a"/><stop offset="1" stop-color="#a96839"/></linearGradient>
