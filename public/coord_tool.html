<!DOCTYPE html>
<html>
<body>
  <canvas id="canvas"></canvas>
  <div id="output" style="white-space: pre-wrap; font-family: monospace;"></div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = '/cartilla/art/games/cow/cow-base.webp';
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
    };

    let currentCow = 1;
    let points = [];
    const pointNames = ['bbox_tl', 'bbox_br', 'tail_base', 'tail_mid', 'head', 'ear_l', 'ear_r', 'muzzle', 'eye_l', 'eye_r'];
    const results = [];

    canvas.onclick = (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      points.push({x: Math.round(x), y: Math.round(y)});
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI*2);
      ctx.fill();

      if (points.length === pointNames.length) {
        const cowData = { id: currentCow };
        points.forEach((p, i) => cowData[pointNames[i]] = p);
        results.push(cowData);
        currentCow++;
        points = [];
        document.getElementById('output').textContent = JSON.stringify(results, null, 2);
      }
    };
  </script>
</body>
</html>
