name: Cleanup stale branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-stale-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin             | awk '{sub("refs/heads/","",$2); print $2}'             | while IFS= read -r branch; do
                if [ "$branch" = "main" ]; then
                  continue
                fi
                echo "Deleting $branch"
                git push origin --delete "$branch"
              done

      - name: Verify only main remains
        shell: bash
        run: |
          set -euo pipefail
          branches="$(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}')"
          echo "$branches"
          test "$branches" = "main"
