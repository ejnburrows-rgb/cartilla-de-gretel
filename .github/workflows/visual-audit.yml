name: Visual Audit

# HISTORICAL manual-only workflow: retained for reference, NOT authorized to run under current owner instructions.
# Do not invoke GitHub Actions or hosted runners unless the owner explicitly authorizes them in a future directive.
# Reuse Jules' existing targeted screenshots/tests; no blanket repeated visual audit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and run required non-browser quality gates
        run: pnpm build

      - name: Verify production art inventory and source identity
        run: pnpm visual:metadata:check

      - run: pnpm exec playwright install --with-deps chromium

      - name: Compare recovery layouts with approved references
        run: pnpm test:visual

      - name: Capture full Workbook and Flip Chart visual audit
        run: pnpm exec playwright test tests/e2e/visual-audit.spec.ts --project=chromium

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartilla-platform-visual-audit
          path: test-results/visual-audit
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
