name: Import Cartilla PDF from Notion

on:
  push:
    branches: [main]
    paths:
      - '.cartilla-import/notion-url.txt'
      - 'scripts/notion-pdf-fetch.mjs'
      - 'scripts/package.json'
      - '.github/workflows/import-book-pdf.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read config
        run: |
          set -euo pipefail
          if [ ! -f .cartilla-import/notion-url.txt ]; then
            echo "::error::Config file .cartilla-import/notion-url.txt is missing."
            exit 1
          fi
          URL="$(sed -n '1p' .cartilla-import/notion-url.txt | tr -d '[:space:]')"
          OUT="$(sed -n '2p' .cartilla-import/notion-url.txt | tr -d '[:space:]')"
          if [ -z "$OUT" ]; then OUT="public/book/book.pdf"; fi
          if [ -z "$URL" ]; then
            echo "::error::First line of .cartilla-import/notion-url.txt must be a Notion public URL."
            exit 1
          fi
          echo "NOTION_URL=$URL" >> "$GITHUB_ENV"
          echo "TARGET_PATH=$OUT" >> "$GITHUB_ENV"
          echo "Notion URL:  $URL"
          echo "Target path: $OUT"

      - name: Install Playwright + Chromium
        working-directory: scripts
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Fetch PDF from public Notion page
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$TARGET_PATH")"
          node scripts/notion-pdf-fetch.mjs "$NOTION_URL" "$TARGET_PATH"

      - name: Verify file is a real PDF
        run: |
          set -euo pipefail
          ls -lh "$TARGET_PATH"
          file "$TARGET_PATH"
          if ! file --brief --mime-type "$TARGET_PATH" | grep -qi 'application/pdf'; then
            echo "::error::Downloaded file is not a PDF."
            head -c 256 "$TARGET_PATH" | xxd | head -20
            exit 1
          fi
          echo "Size: $(stat -c%s "$TARGET_PATH") bytes"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_PATH"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(book): import Cartilla PDF from Notion via Actions"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cartilla PDF importer"
            echo ""
            echo "- Source: \`$NOTION_URL\`"
            echo "- Target: \`$TARGET_PATH\`"
            if [ -f "$TARGET_PATH" ]; then
              echo "- Size:   \`$(stat -c%s "$TARGET_PATH") bytes\`"
            fi
            echo ""
            echo "Vercel will redeploy on the resulting commit."
          } >> "$GITHUB_STEP_SUMMARY"
