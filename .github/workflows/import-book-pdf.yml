name: Import Cartilla PDF from Notion

on:
  push:
    branches: [main]
    paths:
      - '.cartilla-import/notion-url.txt'
      - 'scripts/notion-pdf-fetch.mjs'
      - 'scripts/package.json'
      - '.github/workflows/import-book-pdf.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read config
        run: |
          set -euxo pipefail
          if [ ! -f .cartilla-import/notion-url.txt ]; then
            echo "::error::Config file .cartilla-import/notion-url.txt is missing."
            exit 1
          fi
          ARG="$(sed -n '1p' .cartilla-import/notion-url.txt | tr -d '[:space:]')"
          OUT="$(sed -n '2p' .cartilla-import/notion-url.txt | tr -d '[:space:]')"
          if [ -z "$OUT" ]; then OUT="public/book/book.pdf"; fi
          if [ -z "$ARG" ]; then
            echo "::error::Line 1 missing."
            exit 1
          fi
          echo "NOTION_ARG=$ARG" >> "$GITHUB_ENV"
          echo "TARGET_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Install Playwright + Chromium
        working-directory: scripts
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Prepare debug dir
        run: |
          set -euxo pipefail
          rm -rf .cartilla-import/debug
          mkdir -p .cartilla-import/debug
          mkdir -p "$(dirname "$TARGET_PATH")"
          echo fail > .cartilla-import/debug/_status

      - name: Fetch PDF
        env:
          DEBUG_DIR: .cartilla-import/debug
        run: |
          set -o pipefail
          rc=0
          node scripts/notion-pdf-fetch.mjs "$NOTION_ARG" "$TARGET_PATH" 2>&1 | tee .cartilla-import/debug/run.log || rc=$?
          echo "$rc" > .cartilla-import/debug/_exit_code
          if [ "$rc" = "0" ]; then
            echo success > .cartilla-import/debug/_status
          else
            echo fail > .cartilla-import/debug/_status
          fi

      - name: Verify PDF
        run: |
          set -euxo pipefail
          STATUS="$(cat .cartilla-import/debug/_status)"
          if [ "$STATUS" != "success" ]; then
            echo "Fetch did not succeed (status=$STATUS); skipping verify."
            exit 0
          fi
          ls -lh "$TARGET_PATH"
          file "$TARGET_PATH"
          if ! file --brief --mime-type "$TARGET_PATH" | grep -qi 'application/pdf'; then
            echo "::error::Downloaded file is not a PDF."
            head -c 256 "$TARGET_PATH" | xxd | head -20
            echo fail > .cartilla-import/debug/_status
            exit 1
          fi
          stat -c%s "$TARGET_PATH" > .cartilla-import/debug/pdf-size.txt

      - name: Commit results (always)
        if: always()
        run: |
          set -euxo pipefail
          STATUS="$(cat .cartilla-import/debug/_status 2>/dev/null || echo fail)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cartilla-import/debug
          if [ "$STATUS" = "success" ]; then
            git add "$TARGET_PATH"
          fi
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            git commit -m "chore(book): import Cartilla PDF + debug artifacts"
          else
            git commit -m "chore(import): commit debug artifacts (fetch failed)"
          fi
          git push

      - name: Fail job if fetch failed
        if: always()
        run: |
          STATUS="$(cat .cartilla-import/debug/_status 2>/dev/null || echo fail)"
          if [ "$STATUS" != "success" ]; then
            echo "::error::Fetch failed. Debug artifacts committed to .cartilla-import/debug/"
            exit 1
          fi
          echo "Fetch succeeded."

      - name: Summary
        if: always()
        run: |
          STATUS="$(cat .cartilla-import/debug/_status 2>/dev/null || echo fail)"
          {
            echo "### Cartilla PDF importer"
            echo ""
            echo "- Argument: \`$NOTION_ARG\`"
            echo "- Target  : \`$TARGET_PATH\`"
            echo "- Fetch   : \`$STATUS\`"
            if [ -f "$TARGET_PATH" ] && [ "$STATUS" = "success" ]; then
              echo "- Size    : \`$(stat -c%s "$TARGET_PATH") bytes\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
