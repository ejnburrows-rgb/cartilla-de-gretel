name: One-time branch cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            [ "$branch" = "main" ] && continue
            encoded=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$encoded"
          done
