name: Cartilla PR Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartilla-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full release gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Deterministic dependency install
        run: pnpm install --frozen-lockfile

      - name: Content validator
        run: pnpm run validate:content

      - name: Art color validator
        run: pnpm run validate:art-color

      - name: Asset and lesson sanity validator
        run: pnpm run check:sanity

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Playwright browser smoke tests
        run: pnpm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cartilla-failure-evidence
          path: |
            test-results/**
            playwright-report/**
            dist/**
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
