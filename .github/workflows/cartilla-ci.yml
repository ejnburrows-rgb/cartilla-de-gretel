name: Cartilla CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Cartilla
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Security note: GitHub's native secret scanning is paid on private repos.
      # gitleaks should be added as a free replacement. Until then, this CI blocks
      # on a simple regex scan for common secret patterns in the PR diff.
      - name: Surface scan for secret-like strings in diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} -- . | grep -Ei '(api[_-]?key|secret|token|password|private[_-]?key|connection[_-]?string)' || true
          echo "If any secret-like strings appeared above, block the PR and investigate."

      - name: Dependency audit (warning only)
        run: pnpm audit --audit-level moderate || true
