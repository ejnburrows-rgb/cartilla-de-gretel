name: Regenerate client changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cambios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/generate-cambios.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "E N"
          git config user.email "ejneendcg@gmail.com"
          git add docs/cambios.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: regenerate cambios.md [skip ci]"
            git push
          fi
