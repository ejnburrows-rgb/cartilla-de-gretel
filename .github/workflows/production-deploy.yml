name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: $ secrets.VITE_SUPABASE_URL 
          VITE_SUPABASE_PUBLISHABLE_KEY: $ secrets.VITE_SUPABASE_PUBLISHABLE_KEY 

  supabase:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    if: $ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_DB_PASSWORD != '' 
    env:
      SUPABASE_ACCESS_TOKEN: $ secrets.SUPABASE_ACCESS_TOKEN 
      SUPABASE_DB_PASSWORD: $ secrets.SUPABASE_DB_PASSWORD 
      SUPABASE_PROJECT_REF: $ secrets.SUPABASE_PROJECT_REF 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        run: supabase db push

  vercel:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    needs: [verify, supabase]
    if: $ always() && needs.verify.result == 'success' && (needs.supabase.result == 'success' || needs.supabase.result == 'skipped') 
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: $ secrets.VERCEL_TOKEN 
      VERCEL_ORG_ID: $ secrets.VERCEL_ORG_ID 
      VERCEL_PROJECT_ID: $ secrets.VERCEL_PROJECT_ID 
      VITE_SUPABASE_URL: $ secrets.VITE_SUPABASE_URL 
      VITE_SUPABASE_PUBLISHABLE_KEY: $ secrets.VITE_SUPABASE_PUBLISHABLE_KEY 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production bundle
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
