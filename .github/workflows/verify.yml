name: Verify

# Owner-authorized 2026-11-01: lightweight verification on public-repository PRs.
# No automatic merges, deployment, paid runners, or secrets.
# The full visual audit remains manual. SonarQube Cloud remains advisory.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate project policy
        run: pnpm verify:policy
      - name: Typecheck
        run: pnpm typecheck
      # The current main has four confirmed failures in the full performance
      # budget suite. Keep that investigation visible; do not make unrelated
      # PRs unmergeable because of a known pre-existing baseline.
      - name: Focused student, teacher and content regression tests
        run: >-
          pnpm exec vitest run
          src/routes/__tests__/student-routing.test.tsx
          src/routes/cartilla/__tests__/learner-resume-isolation.test.tsx
          src/lib/__tests__/auth-role.test.ts
          src/lib/__tests__/lesson-grading.test.ts
          tests/practica.test.tsx
      - name: Verify production bundle compiles
        run: pnpm exec vite build
