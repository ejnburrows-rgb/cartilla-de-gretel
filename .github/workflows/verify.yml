name: Verify

# HISTORICAL manual-only workflow: retained for reference, NOT authorized to run under current owner instructions.
# Do not invoke GitHub Actions or hosted runners unless the owner explicitly authorizes them in a future directive.
# Direct Jules exact-head verification defined by AGENTS.md remains the approved route.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
