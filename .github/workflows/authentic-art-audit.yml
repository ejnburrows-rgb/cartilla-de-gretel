name: Authentic flipchart art audit

on:
  push:
    branches:
      - repair/authentic-flipchart-art
    paths:
      - 'scripts/find-authentic-flipchart-art.py'
      - '.github/workflows/authentic-art-audit.yml'
      - 'public/cartilla/art/faithful/**'
      - 'public/cartilla/images/teacher-flipchart/**'
      - 'public/cartilla/images/source/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate-authentic-art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Install image matcher
        run: |
          python -m pip install --disable-pip-version-check --quiet opencv-python-headless numpy

      - name: Match seven disputed images against all 62 teacher pages
        run: python scripts/find-authentic-flipchart-art.py

      - name: Show audit summary
        if: always()
        run: |
          test -f audit/authentic-art/report.md && cat audit/authentic-art/report.md || true

      - name: Upload candidate crops and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentic-art-audit
          path: audit/authentic-art/
          if-no-files-found: error
          retention-days: 7
