<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sin conexión — La Cartilla de Gretel</title>
  <style>
    :root {
      --bg-color: #fdfcfa;
      --text-main: #1c1917;
      --text-sub: #78716c;
      --accent: #c98c4f;
      --accent-hover: #b0743b;
      --card-bg: #ffffff;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --accent: #c98c4f;
        --accent-hover: #e09d5c;
        --card-bg: #1e293b;
        --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      }
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .container {
      max-width: 420px;
      padding: 2.5rem 2rem;
      background-color: var(--card-bg);
      border-radius: 2rem;
      box-shadow: var(--shadow);
      margin: 1.5rem;
      box-sizing: border-box;
      border: 1px solid rgba(0,0,0,0.03);
    }
    .gretel-avatar {
      width: 120px;
      height: 120px;
      margin-bottom: 1.5rem;
      border-radius: 50%;
      border: 4px solid var(--accent);
      padding: 4px;
      background-color: var(--bg-color);
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin: 0 0 0.5rem 0;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-sub);
      margin: 0 0 2rem 0;
    }
    p span {
      display: block;
      font-size: 0.85rem;
      margin-top: 0.4rem;
      opacity: 0.85;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.85rem;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(201, 140, 79, 0.2);
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:hover {
      background-color: var(--accent-hover);
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/gretel/thinking.webp" alt="Gretel pensando" class="gretel-avatar">
    <h1>¿Dónde está el Internet?</h1>
    <p>
      Actualmente estás sin conexión a Internet.
      <span>You are offline. Please check your network connection.</span>
    </p>
    <button class="btn" onclick="window.location.reload()">Reintentar / Retry</button>
  </div>
</body>
</html>
