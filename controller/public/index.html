<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartilla Controller</title><style>
:root{font-family:system-ui,sans-serif;color:#18324c;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{margin:0;font-size:28px}header p{margin:6px 0;color:#596b7b}.connection{padding:20px;background:white;border:1px solid #d9e1e8;border-radius:8px;margin:24px 0}label{display:block;font-size:14px;margin-bottom:8px}input,button{font:inherit;padding:10px 14px;border:1px solid #a9b8c6;border-radius:5px}input{width:min(500px,70%)}button{background:#183f61;color:white;cursor:pointer}#notice{margin:16px 0;white-space:pre-wrap}#counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.count{background:white;border:1px solid #d9e1e8;border-top:4px solid #677a8b;padding:14px;border-radius:6px}.count span{font-size:11px;font-weight:700;letter-spacing:.6px}.count strong{display:block;font-size:27px;margin-top:6px}.running{border-top-color:#287bb4}.verified{border-top-color:#288255}.blocked,.failed,.dead_letter{border-top-color:#bb593b}.retrying{border-top-color:#b38a32}article{background:white;border:1px solid #d9e1e8;border-radius:8px;margin:18px 0;padding:20px}article h2{font-size:17px;margin:0 0 15px}dl{display:grid;grid-template-columns:160px 1fr;gap:8px;font-size:14px}dt{color:#596b7b}dd{margin:0;overflow-wrap:anywhere}#empty{padding:24px 0;color:#596b7b}.owner{background:#f3f6f9;padding:12px;margin-top:15px}small{color:#596b7b}a{color:#17659a}@media(max-width:600px){header{display:block}dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:9px}input{width:100%;margin-bottom:10px}main{padding:22px 14px}}
</style><main><header><div><h1>Cartilla Controller</h1><p>Durable jobs. Independent GitHub verification.</p></div><small id="updated">Loading live totals</small></header><section class="connection" id="connection"><label for="token">Read-only access token</label><input id="token" type="password" autocomplete="off" placeholder="Enter configured read token"><button id="connect">Connect</button><p><small>The token stays in this page’s memory. Closing the page clears it.</small></p></section><div id="notice" role="status">Loading live operational totals. Connect below to view protected job details.</div><section id="counts" aria-label="Job status counts"></section><section id="jobs" aria-label="Controller jobs"></section><div id="empty"></div></main><script>
const names=['running','waiting','retrying','blocked','failed','dead_letter','verified'];let token='';
const node=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};
for(const name of names){const e=node('div','');e.className='count '+name;e.append(node('span',name.replace('_',' ').toUpperCase()),node('strong','—'));e.dataset.status=name;document.querySelector('#counts').append(e)}
async function get(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+token},cache:'no-store'});const body=await r.json();if(!r.ok){const e=new Error(body.error||'Connection needs configuration');e.body=body;throw e}return body}
async function overview(){try{const r=await fetch('/api/overview',{cache:'no-store'});if(!r.ok)throw Error('Live totals temporarily unavailable');const state=await r.json();document.querySelectorAll('.count').forEach(e=>e.querySelector('strong').textContent=state.statuses[e.dataset.status]??0);document.querySelector('#updated').textContent='Live totals · '+new Date().toLocaleTimeString();if(!token)document.querySelector('#notice').textContent='Live controller totals · OpenHands '+(state.worker_enabled?'enabled':'disabled')+'. Detailed jobs require read-only access.';}catch(e){document.querySelector('#notice').textContent=e.message;}}
async function refresh(){try{
 const state=await get('/api/status');document.querySelectorAll('.count').forEach(e=>e.querySelector('strong').textContent=state.statuses[e.dataset.status]??0);
 const {jobs}=await get('/api/jobs');const host=document.querySelector('#jobs');host.replaceChildren();
 for(const j of jobs){const detail=await get('/api/jobs/'+j.id);const card=node('article','');card.append(node('h2',j.status.replace('_',' ').toUpperCase()+' · '+(j.issue?'Issue #'+j.issue:j.kind.replace('_',' '))));const dl=node('dl','');
 const fields={'Job ID':j.id,'Requested action':j.requested_action,'Worker':j.worker||'Controller / not dispatched','External run ID':j.external_id||'—','Starting SHA':j.starting_sha||'—','Attempt':j.attempt_number,'Deadline':j.deadline||'—','Last activity':j.last_activity,'Next retry':j.next_retry||'—','Failure reason':j.failure_reason||'None','Latest GitHub evidence':detail.latest_evidence?JSON.stringify(detail.latest_evidence.data):'Awaiting evidence','Validation':detail.validation?(detail.validation.passed?'Passed':'Rejected')+' · '+detail.validation.name:'Not yet validated','Next action':j.next_action};
 for(const [label,value]of Object.entries(fields)){dl.append(node('dt',label),node('dd',String(value)))}card.append(dl);const owner=node('div','What Emilio needs to do: '+j.what_emilio_needs_to_do);owner.className='owner';card.append(owner);host.append(card)}
 document.querySelector('#empty').textContent=jobs.length?'':'No jobs have been received yet.';document.querySelector('#notice').textContent='Connected · OpenHands '+(state.worker_enabled?'enabled':'disabled')+' · Jules is optional';document.querySelector('#updated').textContent='Updated '+new Date().toLocaleTimeString();
 }catch(e){document.querySelector('#notice').textContent=e.body?.missing?'Configuration needed: '+e.body.missing.join(', '):e.message;}}
document.querySelector('#connect').onclick=()=>{token=document.querySelector('#token').value.trim();document.querySelector('#token').value='';refresh()};overview();setInterval(()=>{if(token)refresh();else overview()},15000);
</script></html>
